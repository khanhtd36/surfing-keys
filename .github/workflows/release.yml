name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm ci
      - name: Build Chrome/Brave extension (production)
        run: browser=chrome npm run build:prod
      - name: Zip build output
        run: |
          cd dist/production/chrome
          zip -r ../../../sk-chrome.zip .
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: sk-chrome.zip
          body: |
            ## Install (Chrome / Brave / any Chromium browser)

            1. Download `sk-chrome.zip` below and unzip it (or run `install.sh` / `install.ps1` from the repo root — they do this for you).
            2. Open `chrome://extensions` (Brave: `brave://extensions`).
            3. Enable **Developer mode** (top-right toggle).
            4. Click **Load unpacked** and select the unzipped folder.
            5. If the Surfingkeys store extension is also installed, disable it to avoid keybinding conflicts.
